name: Sync to mi-restauranteportales

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mi-proyecto
        uses: actions/checkout@v4
        with:
          path: mi-proyecto

      - name: Checkout mi-restauranteportales
        uses: actions/checkout@v4
        with:
          repository: Segundo715/mi-restauranteportales
          token: ${{ secrets.PORTALES_PAT }}
          ref: master
          path: mi-restauranteportales

      - name: Sync files
        run: |
          # app/ completo — excluir archivos con branding/colores propios de cada restaurante
          rsync -av \
            --exclude='api/auth/route.ts' \
            --exclude='admin/layout.tsx' \
            --exclude='admin/login/page.tsx' \
            --exclude='admin/configuracion/page.tsx' \
            --exclude='admin/menu/page.tsx' \
            --exclude='admin/recipes/page.tsx' \
            --exclude='globals.css' \
            --exclude='menu/page.tsx' \
            --exclude='page.tsx' \
            --exclude='loyalty/page.tsx' \
            --exclude='registro/page.tsx' \
            --exclude='resena/page.tsx' \
            --exclude='recetas/page.tsx' \
            --exclude='resetas/page.tsx' \
            --exclude='review/page.tsx' \
            --exclude='salon/page.tsx' \
            --exclude='card/' \
            --exclude='components/CustomerNav.tsx' \
            --exclude='components/AdminNav.tsx' \
            --exclude='components/EmployeeNav.tsx' \
            --exclude='employee/login/page.tsx' \
            --exclude='employee/recipes/page.tsx' \
            mi-proyecto/app/ mi-restauranteportales/app/

          # lib/ excepto supabase.ts (portales tiene su propia versión con otra BD)
          rsync -av --exclude='supabase.ts' mi-proyecto/lib/ mi-restauranteportales/lib/

          # Archivos raíz compartidos (next.config.ts NO — portales tiene ignoreBuildErrors)
          rsync -av mi-proyecto/public/ mi-restauranteportales/public/
          cp mi-proyecto/package.json mi-restauranteportales/package.json
          cp mi-proyecto/tsconfig.json mi-restauranteportales/tsconfig.json
          cp mi-proyecto/middleware.ts mi-restauranteportales/middleware.ts 2>/dev/null || true

      - name: Commit y push si hay cambios
        run: |
          cd mi-restauranteportales
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que sincronizar"
          else
            git commit -m "sync: cambios desde mi-proyecto"
            git push
          fi
